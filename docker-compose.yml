services:
  postgres:
    image: postgres:16-alpine
    container_name: zaykadrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zayka}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zayka_pass}
      POSTGRES_DB: ${POSTGRES_DB:-zaykadrop}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zayka} -d ${POSTGRES_DB:-zaykadrop}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - zaykadrop-net

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zaykadrop-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-zayka}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-zayka_pass}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - zaykadrop-net

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: zaykadrop-auth
    restart: unless-stopped
    env_file:
      - ./services/auth/.env
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - zaykadrop-net

  utils:
    build:
      context: ./services/utils
      dockerfile: Dockerfile
    container_name: zaykadrop-utils
    restart: unless-stopped
    env_file:
      - ./services/utils/.env
    environment:
      PORT: 5003
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-zayka}:${RABBITMQ_PASS:-zayka_pass}@rabbitmq:5672
    ports:
      - "5003:5003"
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - zaykadrop-net

  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: zaykadrop-realtime
    restart: unless-stopped
    env_file:
      - ./services/realtime/.env
    environment:
      PORT: 5004
      JWT_SECRET: ${JWT_SECRET:-091b844ccc6741d675cc310c3df8c6c6ce042bc0001f4c3096b8d7e3195467ec66fa4cf1c26db809ccedea51ebd3dedd3f4aa15825c4fa4e6596ff785ac4efa6}
    ports:
      - "5004:5004"
    networks:
      - zaykadrop-net

  restaurent:
    build:
      context: ./services/restaurent
      dockerfile: Dockerfile
    container_name: zaykadrop-restaurent
    restart: unless-stopped
    env_file:
      - ./services/restaurent/.env
    environment:
      PORT: 5001
      DATABASE_URL: postgresql://${POSTGRES_USER:-zayka}:${POSTGRES_PASSWORD:-zayka_pass}@postgres:5432/${POSTGRES_DB:-zaykadrop}
      DATABASE_SSL: "false"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-zayka}:${RABBITMQ_PASS:-zayka_pass}@rabbitmq:5672
      ORDER_READY_QUEUE: ${ORDER_READY_QUEUE:-order_ready_queue}
      UTILS_SERVICE: http://utils:5003
      REALTIME_SERVICE: http://realtime:5004
      RIDER_SERVICE: http://rider:5002
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      utils:
        condition: service_started
      realtime:
        condition: service_started
    networks:
      - zaykadrop-net

  rider:
    build:
      context: ./services/rider
      dockerfile: Dockerfile
    container_name: zaykadrop-rider
    restart: unless-stopped
    env_file:
      - ./services/rider/.env
    environment:
      PORT: 5002
      DATABASE_URL: postgresql://${POSTGRES_USER:-zayka}:${POSTGRES_PASSWORD:-zayka_pass}@postgres:5432/${POSTGRES_DB:-zaykadrop}
      DATABASE_SSL: "false"
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-zayka}:${RABBITMQ_PASS:-zayka_pass}@rabbitmq:5672
      ORDER_READY_QUEUE: ${ORDER_READY_QUEUE:-order_ready_queue}
      UTILS_SERVICE: http://utils:5003
      REALTIME_SERVICE: http://realtime:5004
      RESTAURANT_SERVICE: http://restaurent:5001
    ports:
      - "5002:5002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      utils:
        condition: service_started
      realtime:
        condition: service_started
      restaurent:
        condition: service_started
    networks:
      - zaykadrop-net

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  zaykadrop-net:
    driver: bridge
