services:
  nginx:
    image: nginx:alpine
    container_name: zaykadrop-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth
      - restaurent
      - rider
      - utils
      - realtime
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_AUTH_SERVICE: ""
        VITE_RESTURENT_SERVICE: ""
        VITE_RIDER_SERVICE: ""
        VITE_UTILS_SERVICE: ""
        VITE_REALTIME_SERVICE: ""
    container_name: zaykadrop-frontend
    restart: always
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: zaykadrop-auth
    restart: always
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5000/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  utils:
    build:
      context: ./services/utils
      dockerfile: Dockerfile
    container_name: zaykadrop-utils
    restart: always
    environment:
      PORT: 5003
      RABBITMQ_URL: ${RABBITMQ_URL}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5003/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  realtime:
    build:
      context: ./services/realtime
      dockerfile: Dockerfile
    container_name: zaykadrop-realtime
    restart: always
    environment:
      PORT: 5004
      RABBITMQ_URL: ${RABBITMQ_URL}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5004/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  restaurent:
    build:
      context: ./services/restaurent
      dockerfile: Dockerfile
    container_name: zaykadrop-restaurent
    restart: always
    environment:
      PORT: 5001
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      RABBITMQ_URL: ${RABBITMQ_URL}
      ORDER_READY_QUEUE: ${ORDER_READY_QUEUE:-order_ready_queue}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      UTILS_SERVICE: http://utils:5003
      REALTIME_SERVICE: http://realtime:5004
      RIDER_SERVICE: http://rider:5002
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      utils:
        condition: service_started
      realtime:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5001/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  rider:
    build:
      context: ./services/rider
      dockerfile: Dockerfile
    container_name: zaykadrop-rider
    restart: always
    environment:
      PORT: 5002
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      RABBITMQ_URL: ${RABBITMQ_URL}
      ORDER_READY_QUEUE: ${ORDER_READY_QUEUE:-order_ready_queue}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      UTILS_SERVICE: http://utils:5003
      REALTIME_SERVICE: http://realtime:5004
      RESTAURANT_SERVICE: http://restaurent:5001
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      utils:
        condition: service_started
      realtime:
        condition: service_started
      restaurent:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e 'require(\"http\").get(\"http://localhost:5002/health\", (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - zaykadrop-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  zaykadrop-net:
    driver: bridge

